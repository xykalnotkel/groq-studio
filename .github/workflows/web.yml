name: Build Web

on:
  push:
    branches: [main, master]
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build situs Astro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependency
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: web
        env:
          # Opsional: isi secret PUBLIC_GROQ_API_KEY kalau ingin key bawaan.
          # Ingat: nilai PUBLIC_* ikut ke bundle dan bisa dibaca siapa pun.
          PUBLIC_GROQ_API_KEY: ${{ secrets.PUBLIC_GROQ_API_KEY }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xystudio-web
          path: web/dist
          retention-days: 30
