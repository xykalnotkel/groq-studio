name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Jenis build'
        type: choice
        options: [release, debug]
        default: release

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  check:
    name: Analisis & tes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Ambil dependency
        run: flutter pub get

      - name: Cek format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analisis kode
        run: flutter analyze

      - name: Tes widget
        # Tag "screenshot" hanya dipakai untuk membuat gambar promosi.
        run: flutter test --exclude-tags=screenshot

  build:
    name: Build APK / AAB
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Ambil dependency
        run: flutter pub get

      # Opsional: kalau secret keystore diisi, APK/AAB ditandatangani dengan
      # key milikmu sendiri (siap unggah ke Play Store).
      - name: Siapkan keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::Tanpa keystore — APK ditandatangani dengan key debug."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          cat > key.properties <<EOF
          storeFile=keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "::notice::Keystore siap, build akan ditandatangani."

      - name: Build APK + App Bundle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MODE: ${{ inputs.mode || 'release' }}
        run: |
          set -e
          ARGS="--$MODE"
          if [ "$MODE" = "release" ]; then
            # Obfuscate supaya key hasil --dart-define lebih sulit dibaca
            # kalau APK dibongkar. Symbols diunggah terpisah.
            ARGS="$ARGS --obfuscate --split-debug-info=build/symbols"
          fi
          if [ -n "$GROQ_API_KEY" ]; then
            ARGS="$ARGS --dart-define=GROQ_API_KEY=$GROQ_API_KEY"
          fi

          flutter build apk $ARGS
          flutter build apk $ARGS --split-per-abi
          flutter build appbundle $ARGS

          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d+ -f1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp "build/app/outputs/flutter-apk/app-$MODE.apk" \
             "dist/GroqStudio-$VERSION-universal.apk"
          for f in build/app/outputs/flutter-apk/*-$MODE.apk; do
            case "$f" in
              */app-$MODE.apk) continue ;;
            esac
            ABI=$(basename "$f" | sed -E "s/app-(.+)-$MODE\.apk/\1/")
            cp "$f" "dist/GroqStudio-$VERSION-$ABI.apk"
          done
          cp "build/app/outputs/bundle/$MODE/app-$MODE.aab" "dist/GroqStudio-$VERSION.aab"
          ls -lh dist

      - name: Upload symbol obfuscation
        if: ${{ inputs.mode != 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ env.VERSION }}
          path: build/symbols
          retention-days: 30

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: groq-studio-${{ env.VERSION }}
          path: dist/*
          retention-days: 30

      - name: Buat GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
