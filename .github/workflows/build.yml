name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Jenis build'
        type: choice
        options: [release, debug]
        default: release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analisis & tes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Ambil dependency
        run: flutter pub get

      - name: Cek format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analisis kode
        run: flutter analyze

      - name: Tes widget
        run: flutter test

  build:
    name: Build APK / AAB
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Ambil dependency
        run: flutter pub get

      # Opsional: kalau kamu menyiapkan secret keystore, APK/AAB akan
      # ditandatangani dengan key milikmu sendiri (siap unggah ke Play Store).
      - name: Siapkan keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks
          cat > key.properties <<EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build APK + App Bundle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -e
          MODE="${{ github.event.inputs.mode || 'release' }}"
          ARGS="--$MODE"
          if [ -n "$GROQ_API_KEY" ]; then
            ARGS="$ARGS --dart-define=GROQ_API_KEY=$GROQ_API_KEY"
          fi

          flutter build apk $ARGS
          flutter build apk $ARGS --split-per-abi
          flutter build appbundle $ARGS

          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d+ -f1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-$MODE.apk "dist/GroqStudio-$VERSION-universal.apk"
          for f in build/app/outputs/flutter-apk/*-$MODE.apk; do
            case "$f" in
              */app-$MODE.apk) continue ;;
            esac
            ABI=$(basename "$f" | sed -E "s/app-(.+)-$MODE\.apk/\1/")
            cp "$f" "dist/GroqStudio-$VERSION-$ABI.apk"
          done
          cp build/app/outputs/bundle/${MODE}/app-$MODE.aab "dist/GroqStudio-$VERSION.aab"
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: groq-studio-${{ env.VERSION }}
          path: dist/*
          retention-days: 30

      - name: Buat GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
